overwrite: true
schema:
  - ../schema.graphql
documents: "src/app/graphQL/*.graphql"
generates:
  src/app/graphQL/globalTypes.ts:
    plugins:
      - typescript
    config:
      typesSuffix: Dto
      enumPrefix: false
      onlyOperationTypes: true
      scalars: &scalars
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkModelId: string
        CkRecordId: string
        CkTypeId: string
        BigInt: any
        DateTime: any
        LargeBinary: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .ts
    plugins:
      - "typescript-operations"
      - "typescript-apollo-angular"
    config:
      typesSuffix: Dto
      addExplicitOverride: true
      importSchemaTypesFrom: src/app/graphQL/globalTypes
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      scalars: *scalars
