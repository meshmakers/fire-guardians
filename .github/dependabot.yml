# Dependabot keeps the NuGet packages, the npm packages of the client app and the
# Dockerfile base images current.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/FireGuardiansWebApp/ClientApp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/src/FireGuardiansWebApp"
    schedule:
      interval: "weekly"
    ignore:
      # The meshmakers/* platform images are bumped deliberately with the platform toolchain;
      # Dependabot misreads their legacy tag scheme (8.0-<date> sorts above 1.3.0.0).
      - dependency-name: "meshmakers/*"
